<div class=fg style="margin-top:12px"><label>Kas awal laci (Rp)<input id=ka type=number value=${lp?lp.fisik:0}></label><label>Uang tunai fisik di laci (Rp)<input id=kf type=number></label></div>

function closeShift(){const u=curU(),S=openS(u),since=lastEnd(u),kf=g('kf').value;
 if(kf==='')return alert('Isi uang fisik di laci terlebih dahulu');if(!S.length&&!atmSum(u).n&&!confirm('Belum ada transaksi di shift ini. Tetap tutup shift?'))return;
 const m=shSum(S),am=atmSum(u),ka=+g('ka').value||0,exp=ka+m.tun+am.kas,h={id:uid(),atmN:am.n,atmKas:am.kas,atmFee:am.fee,atmLaba:am.laba,tun:m.tun,qr:m.qr,tf:m.tf,u,by:me.u,from:since||(S.length?sts(S[0]):Date.now()),to:Date.now(),n:m.n,gross:m.gross,disc:m.disc,rev:m.rev,ecer:m.ecer,gros:m.gros,ka,exp,fisik:+kf,sel:+kf-exp,items:Object.entries(m.by).map(([n,b])=>({n,q:b.q,t:b.t}))};
 D.shifts.push(h);save();render();alert(`Shift ${u} ditutup.\nPenjualan: ${Rp(h.rev)}\nSelisih kas: ${Rp(h.sel)}`);if(D.set.auto)printHtml(shHtml(h))}
function shHtml(h){const c=D.set,w=c.paper=='58'?'48mm':'72mm',L=(a,b)=>`<div style="display:flex;justify-content:space-between;gap:6px"><span>${a}</span><span>${b}</span></div>`;
 return`<!DOCTYPE html><html><head><meta charset=utf-8><style>@page{margin:0}body{margin:0;padding:2mm;width:${w};font:12px/1.4 "Courier New",monospace;color:#000;background:#fff}.c{text-align:center}hr{border:0;border-top:1px dashed #000;margin:4px 0}</style></head><body><div class=c><b style="font-size:14px">${e(c.store)}</b><br>LAPORAN SHIFT KASIR</div><hr>${L('Kasir',e(h.u))}${L('Mulai',fdt(h.from))}${L('Selesai',fdt(h.to))}<hr>${L('Transaksi',h.n)}${L('Penjualan kotor',Rp(h.gross))}${L('Diskon',Rp(h.disc))}<b>${L('Penjualan bersih',Rp(h.rev))}</b>${L('- Eceran',Rp(h.ecer))}${L('- Grosir',Rp(h.gros))}<hr>${L('Tunai',Rp(h.tun??h.rev))}${L('QRIS',Rp(h.qr||0))}${L('Transfer',Rp(h.tf||0))}${L('Mini ATM ('+(h.atmN||0)+' trx)',Rp(h.atmKas||0))}<hr>${L('Kas awal',Rp(h.ka))}${L('Kas seharusnya',Rp(h.exp))}${L('Uang fisik',Rp(h.fisik))}<b>${L('Selisih',Rp(h.sel))}</b><hr>${h.items.map(i=>L(e(i.n)+' x'+i.q,Rp(i.t))).join('')}<hr><div class=c>Tanda tangan serah terima</div><div style="height:14mm"></div></body></html>`}
function docShift(){const u=curU(),S=openS(u),m=shSum(S);return{title:'Laporan Kasir - '+u,sub:D.set.store+' - dicetak '+fdt(Date.now()),file:'Kasir_'+u+'_'+today(),secs:[
 {name:'Shift Berjalan',head:['Keterangan','Jumlah'],m:[1],rows:[['Transaksi',m.n+' transaksi'],['Penjualan kotor',m.gross],['Diskon',m.disc],['Penjualan bersih',m.rev],['Eceran',m.ecer],['Grosir',m.gros],['Tunai',m.tun],['QRIS',m.qr],['Transfer',m.tf],['Mini ATM (kas neto)',atmSum(u).kas],['Kas seharusnya (tanpa kas awal)',m.tun+atmSum(u).kas]]},
 {name:'Item Terjual',head:['Barang','Qty','Nilai'],m:[2],rows:Object.entries(m.by).map(([n,b])=>[n,b.q,b.t])},
 {name:'Transaksi',head:['No','Tanggal','Waktu','Jenis','Bayar','Diskon','Total'],m:[5,6],rows:S.map(s=>[s.no,s.d,s.t,s.mode,PL[pyo(s)],s.disc,s.total])},
 {name:'Transaksi Mini ATM',head:['Tanggal','Jam','Jenis','Tujuan','Nominal','Biaya','Kas'],m:[4,5,6],rows:openA(u).map(a=>[a.d,a.t,ATY[a.ty][0],a.tujuan,a.nominal,a.fee,a.kas])},
 {name:'Riwayat Shift',head:['Mulai','Selesai','Transaksi','Penjualan','Kas Awal','Seharusnya','Fisik','Selisih'],m:[3,4,5,6,7],rows:D.shifts.filter(h=>h.u==u).map(h=>[fdt(h.from),fdt(h.to),h.n,h.rev,h.ka,h.exp,h.fisik,h.sel])}]}}

let FH=null,fTimer=0,fMsg='';
const fsOk=()=>'showSaveFilePicker' in window&&'showOpenFilePicker' in window&&window.top===window;
const fsWhy=()=>window.top!==window?'Aplikasi sedang dibuka di dalam pratinjau/bingkai, sehingga pemilih file diblokir browser. Unduh file toko-kita.html lalu buka langsung di tab Chrome atau Edge.':'Browser ini belum mendukung simpan otomatis ke file. Gunakan Chrome atau Edge di komputer (bukan Firefox, Safari, atau HP).';
const fsErr=x=>x&&x.name=='SecurityError'?'Pemilih file diblokir browser. Buka toko-kita.html langsung di tab Chrome/Edge sendiri (bukan di dalam pratinjau), atau lewat http://localhost.':'Gagal: '+(x&&x.message);
const fsTypes=[{description:'Data Toko Kita',accept:{'application/json':['.json']}}];
const fsSt=m=>{fMsg=m;['fsc','fst'].forEach(i=>{const el=g(i);if(el)el.textContent=m})};
const idb=(mode,fn)=>new Promise((ok,no)=>{const r=indexedDB.open('tokokita_fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onerror=()=>no(r.error);r.onsuccess=()=>{const t=r.result.transaction('k',mode),q=fn(t.objectStore('k'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)}});
const fsChip=()=>fsOk()&&FH?`<button onclick="fsClick()" title="Simpan otomatis ke file di komputer">💾 <span id=fsc>${e(fMsg||'Tersambung')}</span></button> `:'';
const fsLoginBtn=()=>fsOk()?`<button style="width:100%" onclick=fsOpen()>📂 Buka file data yang sudah ada</button>`:'';
function fsQueue(){if(!FH)return;fsSt('Menyimpan…');clearTimeout(fTimer);fTimer=setTimeout(()=>fsWrite(false),1000)}
async function fsPerm(ask){if(!FH)return false;const o={mode:'readwrite'};if(await FH.queryPermission(o)=='granted')return true;return !!ask&&await FH.requestPermission(o)=='granted'}
async function fsWrite(ask){if(!FH)return;try{if(!await fsPerm(ask)){fsSt('Klik 💾 untuk mengaktifkan');return}const w=await FH.createWritable();await w.write(JSON.stringify(D));await w.close();fsSt('Tersimpan '+nowT())}catch(x){fsSt('Gagal menyimpan - klik 💾')}}
function fsClick(){fsWrite(true)}
async function fsPick(){try{FH=await showSaveFilePicker({suggestedName:'tokokita-data.json',types:fsTypes});await idb('readwrite',s=>s.put(FH,'h'));await fsWrite(true);render()}catch(x){if(x.name!='AbortError')alert(fsErr(x))}}
async function fsOpen(){try{const[h]=await showOpenFilePicker({types:fsTypes}),o=JSON.parse(await(await h.getFile()).text());
 if(!o.prod||!o.users)throw new Error('File ini bukan data Toko Kita');
 if(!confirm('Data di aplikasi saat ini akan diganti dengan isi file ini. Lanjutkan?'))return;
 D=o;ens();try{localStorage.setItem(K,JSON.stringify(D))}catch(x){}FH=h;await idb('readwrite',s=>s.put(h,'h'));me=null;cart=[];fsSt('Tersambung');render();alert('Data berhasil dimuat. Silakan login.')}catch(x){if(x.name!='AbortError')alert(fsErr(x))}}
(async()=>{if(!fsOk())return;try{FH=await idb('readonly',s=>s.get('h'))||null}catch(x){}if(FH){try{fsSt(await FH.queryPermission({mode:'readwrite'})=='granted'?'Tersambung':'Klik 💾 untuk mengaktifkan')}catch(x){FH=null}render()}})();

const KEY={prod:r=>r.id,users:r=>r.u,sales:r=>r.id,shifts:r=>r.id,ops:r=>r.id,mv:r=>r.id,cust:r=>r.id,sup:r=>r.code,pur:r=>r.no,debt:r=>r.id,modules:r=>r.id};
const SC=['mv',...Object.keys(KEY).filter(c=>c!='mv'),'buys','exp'],SORT={sales:r=>r.ts||0,mv:r=>r.ts||0,shifts:r=>r.to||0,ops:r=>r.ts||0};
const SY={ref:null,snap:null,busy:0,msg:'',lm:0,rv:null,rest:null,defer:0,dirty:0};
try{SY.rest=JSON.parse(localStorage.getItem('tokokita_sync'))}catch(x){}
const syRepl=(k,v)=>(v===null||(Array.isArray(v)&&!v.length))?undefined:v;
const hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h};
const hsh=(c,r)=>{const o={...r};delete o._u;if(c=='prod')delete o.s;return JSON.stringify(o,syRepl)};
const setH=s=>{const o={...s};['printer','paper','auto','silent','_u'].forEach(k=>delete o[k]);return JSON.stringify(o,syRepl)};
const tk=(c,k)=>c+':'+String(k).replace(/[.$#\[\]\/]/g,'_');
function kf(c,a){if(KEY[c])return a.map(KEY[c]);const n={};return a.map(r=>{const b=hsh(c,r);n[b]=(n[b]||0)+1;return b+'#'+n[b]})}
const snapOf=d=>{const s={};SC.forEach(c=>{if(!KEY[c])return;const a=d[c]||[],ks=kf(c,a);s[c]={};a.forEach((r,i)=>s[c][ks[i]]=hs(hsh(c,r)))});s.set=setH(d.set||{});return s};
const fixD=d=>{[...new Set([...SC,'adj'])].filter(c=>c!='set').forEach(c=>{if(d[c]&&!Array.isArray(d[c]))d[c]=Object.values(d[c]);if(!Array.isArray(d[c]))d[c]=[]});d.tomb=d.tomb||{};d.set=d.set||{};return d};
SY.ref=D;SY.snap=snapOf(D);
setInterval(()=>{if(SY.ref!==D){SY.ref=D;SY.snap=snapOf(D)}},1000);
/* tandai perubahan lokal (waktu ubah) dan catat penghapusan */
function stamp(){if(SY.ref!==D){SY.ref=D;SY.snap=snapOf(D);return}
 D.tomb=D.tomb||{};const now=Date.now();
 SC.forEach(c=>{if(!KEY[c])return;const a=D[c]||[],ks=kf(c,a),old=SY.snap[c]||{},cur={};
  a.forEach((r,i)=>{const k=ks[i],h=hs(hsh(c,r));cur[k]=h;if(old[k]!==h){r._u=now;delete D.tomb[tk(c,k)]}});
  Object.keys(old).forEach(k=>{if(!(k in cur))D.tomb[tk(c,k)]=now});SY.snap[c]=cur});
 const h=setH(D.set||{});if(h!==SY.snap.set){(D.set=D.set||{})._u=now;SY.snap.set=h}}
/* gabung dua data: gabungkan per catatan, yang terbaru menang, stok dihitung dari mutasi */
function mergeD(L,R){const M={...L},f={toL:0,toR:0},lt=L.tomb||{},rt=R.tomb||{},ro={};
 M.tomb={...rt};Object.keys(lt).forEach(k=>{if(!(M.tomb[k]>=lt[k]))M.tomb[k]=lt[k]});
 Object.keys(M.tomb).forEach(k=>{if(M.tomb[k]>(lt[k]||0))f.toL=1;if(M.tomb[k]>(rt[k]||0))f.toR=1});
 SC.forEach(c=>{const la=L[c]||[],ra=R[c]||[],lk=kf(c,la),rk=kf(c,ra),lm=new Map(),rm=new Map(),out=[],seen=new Set();
  lk.forEach((k,i)=>lm.set(k,la[i]));rk.forEach((k,i)=>rm.set(k,ra[i]));
  [...lk,...rk].forEach(k=>{if(seen.has(k))return;seen.add(k);const a=lm.get(k),b=rm.get(k);let p=a&&b?((a._u||0)>(b._u||0)?a:b):(a||b);
   if(KEY[c]&&M.tomb[tk(c,k)]>(p._u||0)){if(a)f.toL=1;if(b)f.toR=1;return}
   if(a&&b){if(hsh(c,a)!==hsh(c,b)){if(p===a)f.toR=1;else f.toL=1}}else if(a)f.toR=1;else f.toL=1;
   if(c=='mv'&&b&&!a)ro[b.pid]=(ro[b.pid]||0)+(+b.q||0);
   if(c=='prod')p={...p,s:a?(+a.s||0)+(ro[a.id]||0):b.s};
   out.push(p)});
  if(SORT[c])out.sort((x,y)=>SORT[c](x)-SORT[c](y));M[c]=out});
 const ls=L.set||{},rs2=R.set||{},pk=(ls._u||0)>(rs2._u||0)?ls:rs2;
 if(setH(ls)!==setH(rs2)){if(pk===ls)f.toR=1;else f.toL=1}
 M.set={...ls,...pk};['printer','paper','auto','silent'].forEach(k=>{if(k in ls)M.set[k]=ls[k]});
 M.mvMig=L.mvMig||R.mvMig;return{M,f}}

const syOn=()=>!!(SY.rest||FH);
const sySt=m=>{SY.msg=m;['syc','syst'].forEach(i=>{const el=g(i);if(el)el.textContent=m});if(FH&&!SY.rest)fsSt(m)};
const syUrl=s=>SY.rest.url.replace(/\/+$/,'')+'/tokokita/'+encodeURIComponent(SY.rest.code)+(s||'')+'.json';
const syFetch=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const TR=()=>{const t=[];
 if(FH)t.push({n:'file',async rd(ask){if(!await fsPerm(ask))throw new Error('perm');const f=await FH.getFile();SY.lm=f.lastModified;const x=await f.text();return x.trim()?JSON.parse(x):null},
  async wr(o){const w=await FH.createWritable();await w.write(JSON.stringify(o));await w.close();SY.lm=(await FH.getFile()).lastModified}});
 if(SY.rest)t.push({n:'cloud',ver:()=>syFetch(syUrl('-v')),rd:()=>syFetch(syUrl()),
  async wr(o){await syFetch(syUrl(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});SY.rv=Date.now()+'-'+Math.random().toString(36).slice(2,6);await syFetch(syUrl('-v'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(SY.rv)})}});
 return t};
function syRender(){const a=document.activeElement,bz=a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&!(a.id=='sc'&&!a.value),md=!g('modal').hidden;if(bz||md){SY.defer=1;return}SY.defer=0;if(me)render()}
function syApply(M){D=fixD(M);ens();try{localStorage.setItem(K,JSON.stringify(D))}catch(x){}SY.ref=D;SY.snap=snapOf(D);if(me){const u=D.users.find(x=>x.u==me.u);if(u)me=u}syRender()}
async function syncNow(manual){if(SY.busy||!syOn())return;SY.busy=1;sySt('Sinkron…');
 try{stamp();
  for(const t of TR()){let R,v0;
   try{if(t.ver)v0=await t.ver();R=await t.rd(manual)}catch(x){if(x.message=='perm'){sySt('Klik 🔄 untuk mengaktifkan');continue}throw x}
   let f={toL:0,toR:0};
   if(R){if(!R.prod)throw new Error('format data tidak dikenali');const r=mergeD(D,fixD(R));f=r.f;if(f.toL)syApply(r.M)}else f.toR=1;
   if(f.toR)await t.wr(D);else if(t.ver)SY.rv=v0}
  SY.dirty=0;sySt('Sinkron '+nowT())}
 catch(x){sySt('Offline/gagal: '+(x.message||x))}
 SY.busy=0}
async function syTick(){if(SY.busy||!syOn())return;if(SY.defer)syRender();
 try{if(SY.rest&&(await syFetch(syUrl('-v')))!==SY.rv)return syncNow();
  if(FH&&await fsPerm(false)){const f=await FH.getFile();if(f.lastModified!==SY.lm)return syncNow()}}catch(x){sySt('Offline - menunggu koneksi')}}
fsQueue=function(){if(!syOn())return;stamp();try{localStorage.setItem(K,JSON.stringify(D))}catch(x){}SY.dirty=1;sySt('Menyimpan…');clearTimeout(SY.tm);SY.tm=setTimeout(()=>syncNow(),1500)};
fsWrite=async function(ask){if(!FH)return;if(!await fsPerm(ask)){fsSt('Klik 💾 untuk mengaktifkan');return}await syncNow(true)};
setInterval(syTick,8000);setTimeout(()=>syOn()&&syncNow(),3000);
document.addEventListener&&document.addEventListener('visibilitychange',()=>{if(!document.hidden)syTick()});
/* sambungkan / putuskan cloud */
async function syConnect(mode){const url=g('syu').value.trim(),code=g('syk').value.trim();
 if(!/^https:\/\/\S+$/.test(url)||code.length<12)return alert('Isi Database URL (https://...) dan Kode toko minimal 12 karakter.');
 const old=SY.rest;SY.rest={url,code};
 try{const t=TR().find(x=>x.n=='cloud'),R=await t.rd();
  if(mode=='push'){if(R&&R.prod&&!confirm('Di cloud sudah ada data. Data itu akan DITIMPA oleh data komputer ini. Lanjutkan?')){SY.rest=old;return}stamp();await t.wr(D)}
  else{if(!R||!R.prod){SY.rest=old;return alert('Belum ada data di cloud dengan kode itu. Unggah dulu dari komputer pertama.')}
   if(!confirm('Data di komputer ini akan DIGANTI dengan data dari cloud. Lanjutkan?')){SY.rest=old;return}
   D=fixD(R);ens();try{localStorage.setItem(K,JSON.stringify(D))}catch(x){}SY.ref=D;SY.snap=snapOf(D);SY.rv=await t.ver();me=null;cart=[]}
  try{localStorage.setItem('tokokita_sync',JSON.stringify(SY.rest))}catch(x){}
  sySt('Tersambung '+nowT());render();alert(mode=='push'?'Data terunggah. Di komputer lain, pilih "ambil data dari cloud".':'Data berhasil diambil. Silakan login.')}
 catch(x){SY.rest=old;alert('Gagal terhubung: '+x.message+'\nPeriksa URL, aturan (Rules) database, dan koneksi internet.')}}
function syOff(){if(!confirm('Putuskan sinkronisasi cloud di komputer ini? Data di komputer ini tetap ada.'))return;SY.rest=null;try{localStorage.removeItem('tokokita_sync')}catch(x){}sySt('');render()}
